# Default categorization rules
# Add your personal rules to plugins/rules/categories.yaml (gitignored)
rules:
  # Housing
  - pattern: "MARRIOTT|COURTYARD|RESIDENCE INN|HAMPTON INN|HILTON|HYATT|HOLIDAY INN|HOTELS?\\.COM|BOOKING\\.COM"
    category: "Housing/Hotels"
    merchant_clean: "Hotel"

  # Groceries
  - pattern: "WHOLEFDS|WHOLE FOODS|TRADER JOE|SAFEWAY|KROGER|PUBLIX|ALDI|COSTCO(?!.*GAS)"
    category: "Groceries"
  - pattern: "WAL-MART(?!.*PLUS)|WALMART(?!.*PLUS)"
    category: "Groceries"
    merchant_clean: "Walmart"

  # Dining
  - pattern: "UBER.*EATS|DOORDASH|GRUBHUB|POSTMATES"
    category: "Dining/Delivery"
  - pattern: "STARBUCKS|DUNKIN|PEETS COFFEE"
    category: "Dining/Coffee"
  - pattern: "MCDONALD|CHIPOTLE|TACO BELL|DOMINO"
    category: "Dining/Fast Food"
  - pattern: "RESTAURANT|RISTORANTE|TAQUERIA|BISTRO|GRILL|KITCHEN"
    category: "Dining/Restaurants"
    merchant_clean: "Restaurant"

  # Shopping
  - pattern: "TARGET|BEST BUY|HOME DEPOT"
    category: "Shopping"
  - pattern: "AMAZON MARKETPLACE|AMAZON\\.COM(?!.*SVCS)"
    category: "Shopping/Amazon"
    merchant_clean: "Amazon"

  # Transportation
  - pattern: "SHELL|CHEVRON|EXXON|BP|CONOCO"
    category: "Transportation/Gas"
  - pattern: "UBER(?!.*EATS)|LYFT"
    category: "Transportation/Rideshare"
    merchant_clean: "Rideshare"
  - pattern: "PARKING|E-Z.*PASS"
    category: "Transportation/Parking"
  - pattern: "SOUTHWEST|UNITED AIRLINES|DELTA|AMERICAN AIR|JETBLUE"
    category: "Transportation/Flights"
  - pattern: "ENTERPRISE RENT|HERTZ|AVIS|BUDGET RENT"
    category: "Transportation/Rental"

  # Subscriptions
  - pattern: "NETFLIX|SPOTIFY|HULU|DISNEY|APPLE\\.COM/BILL|YOUTUBE|HBO"
    category: "Subscriptions/Entertainment"
  - pattern: "GITHUB|OPENAI|ADOBE|DROPBOX"
    category: "Subscriptions/Tech"

  # Health
  - pattern: "PLANET FITNESS|24 HOUR FITNESS|ANYTIME FITNESS"
    category: "Health/Gym"
  - pattern: "WALGREENS|CVS"
    category: "Health/Pharmacy"

  # Utilities
  - pattern: "ELECTRIC|GAS.*UTILITY|WATER.*UTILITY|INTERNET|COMCAST|VERIZON|T-MOBILE|AT&T"
    category: "Utilities"

  # Transfers & Investments
  - pattern: "WISE|MONEYGRAM|REMITLY|XOOM|WESTERN UNION"
    category: "Remittance"
  - pattern: "SCHWAB|FIDELITY|VANGUARD|E\\*TRADE"
    category: "Investment"

  # Income
  - pattern: "PAYROLL|DIRECT DEP|SALARY"
    category: "Salary/Paycheck"

  # Credit Card Payments
  - pattern: "INTERNET PAYMENT.*THANK|DIRECTPAY|AUTOPAY.*PAYMENT.*THANK"
    category: "Credit Card/Payment"
    merchant_clean: "CC Payment"

  # Insurance
  - pattern: "PROGRESSIVE|GEICO|STATE FARM|ALLSTATE"
    category: "Insurance/Auto"
